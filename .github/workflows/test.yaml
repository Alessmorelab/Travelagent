name: 项目测试

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  miniapp:
    name: 小程序测试与微信构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      ROAM_API_URL: https://roam-ci.invalid/gateway/
    defaults:
      run:
        working-directory: miniapp
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: miniapp/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build:weapp:device
      - run: npm run check:dist
      - run: npm run check:runtime

  backend:
    name: 后端测试
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-miniapp.txt
      - name: 安装后端和测试依赖
        run: python -m pip install -r requirements-miniapp.txt 'pytest>=9,<10' 'pytest-asyncio>=1,<2' pgserver==0.1.4
      - run: python -m pytest -q -rs tests
